<!-- Topbar container. -->
<div class="iv-topbar d-flex align-items-center justify-content-between px-4">
    
    <div class="d-flex align-items-center">
        @if (!showLogout) {
            <button class="btn btn-light d-md-none" (click)="toggleSidebar.emit()">
                <i class="bi bi-list"></i>
            </button>
        } @else {
            <span class="badge px-3 py-2 text-dark">{{ message }}</span>
        }
    </div>

    <div class="d-flex align-items-center gap-3">
        
        @if (!showLogout) {
            <span class="badge px-3 py-2 text-dark">{{ message }}</span>
        }
        
        @if (showLogout) {
            <a class="topbar-logout-link" (click)="onLogout()">
                <i class="bi bi-box-arrow-left"></i>
                <span>Logout</span>
            </a>
        }

        <ng-content></ng-content>
    </div>
</div>
